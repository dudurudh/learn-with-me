name: Weekly programme and funding watch

on:
  schedule:
    - cron: '30 10 * * 0'     # Sunday morning, alongside the spotlight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/watch-programs.mjs
      - name: Commit the snapshots and the diff
        run: |
          if [[ -n "$(git status --porcelain snapshots public/program-changes.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshots public/program-changes.json
            git commit -m "Programme watch $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing changed"
          fi
